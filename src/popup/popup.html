<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TabMarks</title>
    <link rel="stylesheet" href="../ui/base.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <img id="tab-icon" alt="" />
      <div class="tab-info">
        <div id="tab-title" class="ellipsis"></div>
        <div id="current" class="current"></div>
      </div>
    </header>

    <nav class="views" role="tablist">
      <button role="tab" data-view="mark" id="nav-mark">Mark</button>
      <button role="tab" data-view="tabs" id="nav-tabs">Tabs <span id="count" class="count"></span></button>
      <button role="tab" data-view="settings" id="nav-settings">Settings</button>
    </nav>

    <!-- Mark ---------------------------------------------------------------->
    <div class="view" id="view-mark" role="tabpanel">
      <div id="restricted" class="notice" hidden></div>
      <div id="editor">
        <div class="quick-wrap">
          <svg class="quick-icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <input
            id="quick"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="Find a label or color…"
            aria-label="Quick pick a label or color"
          />
          <div id="quick-results" class="popover" hidden></div>
        </div>
        <div id="quick-hint" class="hint">
          <span><kbd>↵</kbd> apply</span><span><kbd>1</kbd>–<kbd>9</kbd> label</span><span><kbd>←</kbd><kbd>→</kbd> group</span
          ><span><kbd>⌘⌫</kbd> unmark</span>
        </div>


        <section>
          <div class="section-head"><h2>Color</h2></div>
          <div id="colors" class="swatches"></div>
        </section>

        <section>
          <div class="section-head">
            <h2>Label</h2>
            <div id="label-groups" class="group-tabs"></div>
          </div>
          <div id="labels" class="chips"></div>
        </section>

        <section>
          <div class="section-head">
            <h2>Note</h2>
            <label class="switch small" title="Show this note as a sticky note on the page">
              <input type="checkbox" id="note-onpage" /><span class="track"></span>On page
            </label>
          </div>
          <div class="note-wrap">
            <textarea id="note" rows="3" placeholder="Jot something down for this tab…"></textarea>
            <span id="note-status" class="note-status"></span>
          </div>
        </section>
      </div>
    </div>

    <!-- Tabs ---------------------------------------------------------------->
    <div class="view" id="view-tabs" role="tabpanel" hidden>
      <div class="search-wrap">
        <svg class="quick-icon" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <input id="search" type="search" placeholder="Search titles, labels, notes, URLs" autocomplete="off" />
      </div>
      <div id="filters" class="seg small"></div>
      <div id="list"></div>
      <div id="closed-wrap" hidden>
        <div class="list-head"><h2>Recently closed <span id="closed-count" class="muted"></span></h2></div>
        <div id="closed"></div>
      </div>
    </div>

    <!-- Settings ------------------------------------------------------------>
    <div class="view" id="view-settings" role="tabpanel" hidden>
      <div class="setting">
        <div class="setting-name">Icon style</div>
        <div id="icon-styles" class="style-grid"></div>
      </div>
      <div class="setting">
        <div class="setting-name">Symbol <span class="muted small">for the Symbol style &amp; title marker</span></div>
        <div id="symbols" class="symbol-grid"></div>
      </div>
      <div class="setting two">
        <div>
          <div class="setting-name">Show mark on</div>
          <div id="show-on" class="seg small"></div>
        </div>
        <div>
          <div class="setting-name">Title marker</div>
          <div id="title-marker" class="seg small"></div>
        </div>
      </div>
      <div class="setting">
        <label class="switch"><input type="checkbox" id="label-in-title" /><span class="track"></span>Show label in tab title</label>
        <label class="switch"><input type="checkbox" id="floating-notes" /><span class="track"></span>Show notes floating on pages</label>
      </div>
      <div class="setting">
        <div class="setting-name">Theme</div>
        <div id="theme" class="seg small"></div>
      </div>
      <div class="setting">
        <div class="setting-name row space">Shortcuts <button id="edit-shortcuts" class="link">Edit</button></div>
        <div id="shortcuts" class="shortcut-list"></div>
      </div>
      <button id="open-options" class="btn block">Rules, labels, colors &amp; backup →</button>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
